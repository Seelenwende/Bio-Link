<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>DigitalSeed · Automatisierung</title>
<link rel="stylesheet" href="/stil.css">
</head>
<body>
<header class="kopf"><div class="huelle">
  <a class="logo-wort" href="#">Digital<span>Seed</span></a>
  <span class="leise">Automatisierung</span>
  <span style="flex:1"></span>
  <button class="zweit klein versteckt" id="abmelden">Abmelden</button>
</div></header>

<main class="huelle" id="app"></main>

<script src="/gemeinsam.js"></script>
<script>
const app = document.getElementById("app");
let schluessel = "";
try { schluessel = localStorage.getItem("ds-schluessel") || ""; } catch {}
let aktuell = null; // Daten des geöffneten Kunden
let reiter = "uebersicht";
let abfrage = null;
let reelsLaufen = false;

const SCHRITTE = [
  ["erfassung", "Website und Profile erfassen"], ["analyse", "Analyse und Bewertung"], ["marke", "Logo, Stimmprofil und CI-Farben"],
  ["website", "Demo der neuen Website"], ["newsletter", "Newsletter-Vorlage"], ["vorlagen", "Vorlagen für Instagram, Facebook und LinkedIn"],
  ["strategie", "Contentplan und Redaktionsplan"], ["inhalte", "Beiträge und Newsletter texten"], ["medien", "Bilder und Reels erzeugen"],
];
const PHASEN = [["produktion", "Produktion (automatisch)"], ["pruefung", "Deine Prüfung"], ["freigabe", "Freigabe durch Kunde"], ["live", "Live: Posten und Berichte"]];
const PHASE_MARKE = { produktion: "gelb", pruefung: "blau", freigabe: "gelb", live: "" };

async function api(pfad, opts = {}) {
  const res = await fetch(pfad, { ...opts, headers: { authorization: `Bearer ${schluessel}`, ...(opts.body && !(opts.body instanceof Blob) ? { "content-type": "application/json" } : {}), ...(opts.headers || {}) } });
  const daten = await res.json().catch(() => ({}));
  if (res.status === 401) { abmelden(); throw new Error("Admin-Schlüssel ungültig."); }
  if (!res.ok) throw new Error(daten.error || `Fehler ${res.status}`);
  return daten;
}
const post = (pfad, body) => api(pfad, { method: "POST", body: JSON.stringify(body) });
const aktion = (body) => post("/api/admin/kunde", { id: aktuell.kunde.id, ...body });

function abmelden() {
  schluessel = "";
  try { localStorage.removeItem("ds-schluessel"); } catch {}
  zeige();
}
document.getElementById("abmelden").onclick = abmelden;

function meldung(text, fehler = false) {
  const el = document.createElement("div");
  el.textContent = text;
  el.style.cssText = `position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:${fehler ? "var(--rot)" : "var(--text)"};color:#fff;padding:10px 16px;border-radius:8px;z-index:9;max-width:90vw;box-shadow:var(--schatten)`;
  document.body.append(el);
  setTimeout(() => el.remove(), fehler ? 6000 : 3000);
}

async function mitKnopf(knopf, fn) {
  knopf.disabled = true;
  try { await fn(); } catch (e) { meldung(e.message, true); } finally { knopf.disabled = false; }
}

/* ---------- Anmeldung ---------- */

function anmeldung() {
  app.innerHTML = `<div class="karte" style="max-width:440px;margin:40px auto">
    <h1>Anmelden</h1><p class="leise">Admin-Schlüssel aus Netlify (DIGITALSEED_ADMIN_KEY).</p>
    <form id="f"><input type="password" id="s" autocomplete="current-password" required><p style="margin-top:12px"><button>Weiter</button></p></form></div>`;
  document.getElementById("f").onsubmit = async (e) => {
    e.preventDefault();
    schluessel = document.getElementById("s").value.trim();
    try { await api("/api/admin/kunden"); try { localStorage.setItem("ds-schluessel", schluessel); } catch {} zeige(); }
    catch (err) { meldung(err.message, true); }
  };
}

/* ---------- Kundenliste und neuer Kunde ---------- */

async function uebersicht() {
  app.innerHTML = `<p class="leise">Lade …</p>`;
  const { kunden, konfiguriert } = await api("/api/admin/kunden");
  const fehlt = [!konfiguriert.anthropic && "ANTHROPIC_API_KEY (ohne ihn läuft nichts)", !konfiguriert.buffer && "BUFFER_API_TOKEN (für automatisches Posten und Berichte)", !konfiguriert.webhook && "DIGITALSEED_WEBHOOK_URL (für Mails an dich und Kunden)"].filter(Boolean);
  app.innerHTML = `
    ${fehlt.length ? `<div class="hinweis" style="margin-bottom:18px"><b>Noch einzurichten in Netlify:</b> ${fehlt.join(" · ")}</div>` : ""}
    <div class="karte">
      <h1>Neuer Kunde</h1>
      <p class="leise">Website eingeben, starten – alles Weitere läuft automatisch: Analyse, Markenprofil, Website-Demo, Vorlagen, Content- und Redaktionsplan, 39 Beiträge und 3 Newsletter für drei Monate. Dauer etwa 15–25 Minuten.</p>
      <form id="neu">
        <div class="formular">
          <div><label for="website">Website *</label><input id="website" name="website" placeholder="beispiel.ch" required></div>
          <div><label for="name">Firmenname <span class="leise">(optional)</span></label><input id="name" name="name"></div>
          <div><label for="email">E-Mail für die Freigabe <span class="leise">(optional)</span></label><input id="email" name="email" type="email"></div>
        </div>
        <details style="margin-top:12px"><summary class="leise">Social-Media-Profile angeben <span class="klein">(sonst werden die auf der Website verlinkten genommen)</span></summary>
          <div class="formular">
            <div><label for="instagram">Instagram</label><input id="instagram" name="instagram" placeholder="@name oder Link"></div>
            <div><label for="facebook">Facebook</label><input id="facebook" name="facebook" placeholder="Link zur Seite"></div>
            <div><label for="linkedin">LinkedIn</label><input id="linkedin" name="linkedin" placeholder="Link zur Unternehmensseite"></div>
          </div>
        </details>
        <p style="margin:16px 0 0"><button id="startknopf">Analyse und Produktion starten</button></p>
      </form>
    </div>
    <h2>Kunden</h2>
    ${kunden.length ? `<div class="raster">${kunden.map(kundenKarte).join("")}</div>` : `<p class="leise">Noch keine Kunden.</p>`}`;
  document.getElementById("neu").onsubmit = (e) => {
    e.preventDefault();
    const daten = Object.fromEntries(new FormData(e.target));
    mitKnopf(document.getElementById("startknopf"), async () => {
      const { id } = await post("/api/admin/kunden", daten);
      location.hash = id;
    });
  };
}

function kundenKarte(k) {
  const fertig = SCHRITTE.filter(([key]) => k.schritte[key].status === "fertig").length;
  const fehler = SCHRITTE.some(([key]) => k.schritte[key].status === "fehler");
  return `<a class="karte" href="#${k.id}" style="text-decoration:none;color:inherit;display:block">
    <div class="zeile" style="justify-content:space-between"><b>${esc(k.name || k.website.replace(/^https?:\/\//, ""))}</b>
    <span class="marke ${fehler ? "rot" : PHASE_MARKE[k.phase]}">${fehler ? "Fehler" : PHASEN.find((p) => p[0] === k.phase)[1]}</span></div>
    <p class="leise klein" style="margin:4px 0 10px">${esc(k.website)}</p>
    <div class="balken"><i style="width:${(fertig / SCHRITTE.length) * 100}%"></i></div>
    <p class="leise klein" style="margin:6px 0 0">${fertig} von ${SCHRITTE.length} Schritten · KI-Kosten ${k.kostenUsd.toFixed(2)} $</p></a>`;
}

/* ---------- Kundendetail ---------- */

async function kundeLaden(id) {
  aktuell = await api(`/api/admin/kunde?id=${encodeURIComponent(id)}`);
  return aktuell;
}

async function kundeAnsicht(id) {
  app.innerHTML = `<p class="leise">Lade …</p>`;
  await kundeLaden(id);
  rendereKunde();
  starteAbfrage();
}

function laeuftNoch() {
  if (!aktuell) return false;
  const k = aktuell.kunde;
  return k.phase === "produktion" && !SCHRITTE.some(([key]) => k.schritte[key].status === "fehler")
    || Object.values(aktuell.freigaben).some((f) => f.status === "in_arbeit" || f.status === "aenderung");
}

function starteAbfrage() {
  clearInterval(abfrage);
  abfrage = setInterval(async () => {
    if (!aktuell || location.hash.slice(1) !== aktuell.kunde.id) return clearInterval(abfrage);
    if (!laeuftNoch()) return;
    const vorher = JSON.stringify([aktuell.kunde.schritte, aktuell.freigaben, aktuell.kunde.phase]);
    await kundeLaden(aktuell.kunde.id).catch(() => null);
    if (JSON.stringify([aktuell.kunde.schritte, aktuell.freigaben, aktuell.kunde.phase]) === vorher) return;
    const tippt = document.activeElement && ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName);
    if (!tippt) rendereKunde();
  }, 6000);
}

const REITER = [
  ["uebersicht", "Übersicht"], ["analyse", "Analyse"], ["marke", "Marke"], ["website", "Website-Demo"], ["newsletter", "Newsletter"],
  ["vorlagen", "Vorlagen"], ["plan", "Content- und Redaktionsplan"], ["beitraege", "Beiträge"], ["veroeffentlichung", "Posten und Berichte"], ["einstellungen", "Einstellungen"],
];

function rendereKunde() {
  const d = aktuell;
  const k = d.kunde;
  const phaseIndex = PHASEN.findIndex((p) => p[0] === k.phase);
  const y = window.scrollY;
  app.innerHTML = `
    <p><a href="#">← Alle Kunden</a></p>
    <div class="zeile" style="justify-content:space-between;align-items:flex-start">
      <div><h1 style="margin-bottom:2px">${esc(k.name || k.website)}</h1><a class="leise" href="${esc(k.website)}" target="_blank" rel="noopener">${esc(k.website)}</a></div>
      <div class="zeile"><span class="leise klein">KI-Kosten ${k.kostenUsd.toFixed(2)} $</span>
        <a class="knopf zweit klein" href="${esc(d.portal)}" target="_blank" rel="noopener">Kundenportal öffnen</a>
        <button class="zweit klein" id="link-kopieren">Portal-Link kopieren</button></div>
    </div>
    <div class="reise">${PHASEN.map(([, name], i) => `<div class="${i <= phaseIndex ? "erreicht" : ""}">${i + 1}. ${name}</div>`).join("")}</div>
    <nav class="reiter">${REITER.map(([key, name]) => `<button data-reiter="${key}" class="${key === reiter ? "aktiv" : ""}">${name}</button>`).join("")}</nav>
    <section id="inhalt"></section>`;
  app.querySelectorAll("[data-reiter]").forEach((b) => (b.onclick = () => { reiter = b.dataset.reiter; rendereKunde(); window.scrollTo(0, 0); }));
  document.getElementById("link-kopieren").onclick = () => navigator.clipboard.writeText(d.portal).then(() => meldung("Link kopiert."));
  const inhalt = document.getElementById("inhalt");
  ({ uebersicht: reiterUebersicht, analyse: () => (inhalt.innerHTML = analyseHtml(d.analyse, { intern: true })), marke: () => (inhalt.innerHTML = markeHtml(d.marke)),
    website: reiterWebsite, newsletter: reiterNewsletter, vorlagen: () => (inhalt.innerHTML = vorlagenHtml(d.vorlagen)), plan: () => (inhalt.innerHTML = strategieHtml(d.strategie)),
    beitraege: reiterBeitraege, veroeffentlichung: reiterVeroeffentlichung, einstellungen: reiterEinstellungen })[reiter](inhalt);
  window.scrollTo(0, y);
  if (k.schritte.medien.status === "fertig") rendereFehlendeReels();
}

function reiterUebersicht(el) {
  const d = aktuell;
  const k = d.kunde;
  const dauer = (s) => (s.start && s.ende ? `${Math.max(1, Math.round((s.ende - s.start) / 1000))} s` : s.start ? "läuft …" : "");
  const offen = d.inhalte ? [...d.inhalte.beitraege, ...d.inhalte.newsletter].filter((x) => d.freigaben[x.id]?.status !== "freigegeben").length : 0;
  const wuensche = Object.entries(d.freigaben).filter(([, f]) => f.status === "aenderung" || f.status === "in_arbeit");
  const reels = d.inhalte?.beitraege.filter((b) => b.format === "reel" && !b.video).length ?? 0;
  el.innerHTML = `
    <div class="raster" style="grid-template-columns:repeat(auto-fit,minmax(340px,1fr))">
      <div class="karte"><h2>Ablauf</h2>
        <ul class="schritte">${SCHRITTE.map(([key, name], i) => {
          const s = k.schritte[key];
          return `<li><span class="punkt ${s.status}">${s.status === "fertig" ? "✓" : i + 1}</span><span style="flex:1">${name}${s.fehler ? `<br><span class="fehler klein">${esc(s.fehler)}</span>` : ""}</span>
            <span class="leise klein">${dauer(s)}</span>${s.status === "fertig" || s.status === "fehler" ? `<button class="zweit klein" data-neustart="${key}" title="Diesen und alle folgenden Schritte neu erzeugen">${s.status === "fehler" ? "Erneut versuchen" : "Neu ab hier"}</button>` : ""}</li>`;
        }).join("")}</ul>
      </div>
      <div class="karte"><h2>Nächster Schritt</h2>${naechsterSchrittHtml(offen, wuensche, reels)}</div>
    </div>`;
  el.querySelectorAll("[data-neustart]").forEach((b) => (b.onclick = () => {
    const name = SCHRITTE.find((s) => s[0] === b.dataset.neustart)[1];
    if (!confirm(`„${name}“ und alle folgenden Schritte neu erzeugen? Bisherige Ergebnisse dieser Schritte werden ersetzt, Freigaben bleiben bestehen.`)) return;
    mitKnopf(b, async () => { await aktion({ aktion: "neustart", ab: b.dataset.neustart }); await kundeLaden(k.id); rendereKunde(); starteAbfrage(); });
  }));
  const senden = document.getElementById("senden");
  if (senden) senden.onclick = () => mitKnopf(senden, async () => {
    if (!aktuell.kunde.email && !confirm("Für diesen Kunden ist keine E-Mail-Adresse hinterlegt. Trotzdem als „gesendet“ markieren? Den Link kannst du dann selbst schicken.")) return;
    const { portal } = await aktion({ aktion: "senden" });
    await kundeLaden(k.id); rendereKunde();
    meldung("Zur Freigabe gesendet.");
    navigator.clipboard?.writeText(portal).catch(() => {});
  });
}

function naechsterSchrittHtml(offen, wuensche, reels) {
  const d = aktuell;
  const k = d.kunde;
  const fehler = SCHRITTE.find(([key]) => k.schritte[key].status === "fehler");
  if (fehler) return `<p class="fehler">Der Schritt „${fehler[1]}“ ist fehlgeschlagen. Starte ihn links neu.</p>`;
  if (k.phase === "produktion") {
    const laeuft = SCHRITTE.find(([key]) => k.schritte[key].status !== "fertig");
    return `<p>Die Produktion läuft automatisch. Gerade: <b>${laeuft?.[1] ?? "…"}</b>.</p><p class="leise">Du kannst die Seite schliessen. Analyse und Website-Demo kannst du schon ansehen, sobald sie fertig sind${d.analyse ? " – die Analyse ist da" : ""}.</p>`;
  }
  const mailtext = `Guten Tag\n\nIhre Inhalte für die nächsten drei Monate sind bereit: Analyse Ihrer Online-Präsenz, Vorschlag für Ihre neue Website und alle Beiträge für Instagram, Facebook und LinkedIn.\n\nSie können alles hier ansehen und freigeben:\n${d.portal}\n\nFreundliche Grüsse\nDigitalSeed`;
  if (k.phase === "pruefung") {
    return `<p><b>Alles ist erzeugt.</b> Prüfe Analyse, Website-Demo und die Beiträge. Einzelne Beiträge kannst du im Reiter „Beiträge“ bearbeiten oder von der KI überarbeiten lassen.</p>
      ${reels ? `<p class="hinweis">${reels} Reel-Video(s) werden gerade in diesem Browser erzeugt. Lass den Tab offen und sichtbar.</p>` : ""}
      <p><button id="senden">An Kunden zur Freigabe senden</button></p>
      <p class="leise klein">${k.email ? `Mit Webhook geht die Mail an ${esc(k.email)}. ` : ""}Ohne Webhook: Link wird kopiert, Mailtext zum Einfügen:</p>
      <textarea readonly style="min-height:150px" class="klein">${esc(mailtext)}</textarea>`;
  }
  if (k.phase === "freigabe") {
    return `<p>Wartet auf die Freigabe durch den Kunden: <b>${offen}</b> Inhalte noch offen.</p>
      ${wuensche.length ? `<p class="hinweis">${wuensche.length} Änderungswunsch/-wünsche – die KI überarbeitet sie automatisch und legt sie dem Kunden erneut vor.</p>` : ""}
      <p class="leise">Freigegebene Beiträge werden automatisch in Buffer eingeplant${Object.keys(k.buffer).length ? "" : " – sobald du im Reiter „Einstellungen“ die Buffer-Kanäle zuordnest"}.</p>`;
  }
  return `<p><b>Live.</b> Alle Inhalte sind freigegeben. Beiträge werden über Buffer veröffentlicht, am 1. jedes Monats entsteht automatisch der Bericht.</p>
    <p class="leise">Nach drei Monaten: „Neu ab hier“ bei „Contentplan und Redaktionsplan“ mit neuem Startdatum (Einstellungen) erzeugt die nächsten drei Monate.</p>`;
}

function reiterWebsite(el) {
  if (aktuell.kunde.schritte.website.status !== "fertig") return (el.innerHTML = `<p class="leise">Die Website-Demo ist noch nicht fertig.</p>`);
  const url = `/demo/${aktuell.kunde.token}`;
  el.innerHTML = `<p class="zeile"><a class="knopf zweit klein" href="${url}" target="_blank" rel="noopener">In neuem Tab öffnen</a><span class="leise klein">Diese Adresse kannst du dem Kunden direkt schicken.</span></p><iframe class="rahmen" src="${url}" title="Website-Demo"></iframe>`;
}

async function reiterNewsletter(el) {
  const d = aktuell;
  const vorlage = `/newsletter/${d.kunde.token}/vorlage`;
  el.innerHTML = newsletterKonzeptHtml(d.newsletter, d.newsletter ? vorlage : null)
    + (d.inhalte ? `<h2>Ausgaben</h2><div class="raster">${d.inhalte.newsletter.map((n) => newsletterAusgabeHtml(n, { freigabe: d.freigaben[n.id], aktionen: `<button class="zweit klein" data-nl="${n.id}">Vorschau</button> <a class="knopf zweit klein" href="/newsletter/${d.kunde.token}/${n.id}?download=1" data-dl="${n.id}">HTML</a>` })).join("")}</div>` : "")
    + (d.newsletter ? `<h2>Vorschau</h2><iframe class="rahmen" id="nl-rahmen" title="Newsletter"></iframe>` : "");
  const rahmen = document.getElementById("nl-rahmen");
  const zeigeNl = async (id) => {
    const res = await fetch(`/newsletter/${d.kunde.token}/${id}`, { headers: { authorization: `Bearer ${schluessel}` } });
    rahmen.srcdoc = await res.text();
  };
  if (rahmen) zeigeNl("vorlage");
  el.querySelectorAll("[data-nl]").forEach((b) => (b.onclick = () => { zeigeNl(b.dataset.nl); rahmen.scrollIntoView({ behavior: "smooth" }); }));
  el.querySelectorAll("[data-dl]").forEach((a) => (a.onclick = async (e) => {
    e.preventDefault();
    const res = await fetch(a.href, { headers: { authorization: `Bearer ${schluessel}` } });
    const link = Object.assign(document.createElement("a"), { href: URL.createObjectURL(await res.blob()), download: `newsletter-${a.dataset.dl}.html` });
    link.click();
  }));
}

/* ---------- Beiträge ---------- */

let filterMonat = 1;
let filterKanal = "";

function reiterBeitraege(el) {
  const d = aktuell;
  if (!d.inhalte) return (el.innerHTML = `<p class="leise">Die Beiträge sind noch nicht fertig.</p>`);
  const liste = d.inhalte.beitraege.filter((b) => b.monat === filterMonat && (!filterKanal || b.kanal === filterKanal));
  el.innerHTML = `
    <div class="zeile" style="margin-bottom:16px">
      ${[1, 2, 3].map((m) => `<button class="${m === filterMonat ? "" : "zweit"} klein" data-monat="${m}">Monat ${m}</button>`).join("")}
      <span style="width:12px"></span>
      ${[["", "Alle Kanäle"], ["instagram", "Instagram"], ["facebook", "Facebook"], ["linkedin", "LinkedIn"]].map(([k, n]) => `<button class="${k === filterKanal ? "" : "zweit"} klein" data-kanal="${k}">${n}</button>`).join("")}
    </div>
    <div class="raster" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">${liste.map((b) => beitragHtml(b, {
      freigabe: d.freigaben[b.id],
      zusatz: bufferStatus(b.id),
      aktionen: `<div class="zeile"><button class="zweit klein" data-bearbeiten="${b.id}">Bearbeiten</button><button class="zweit klein" data-ki="${b.id}">KI überarbeiten lassen</button></div><div id="editor-${b.id}"></div>`,
    })).join("")}</div>`;
  el.querySelectorAll("[data-monat]").forEach((b) => (b.onclick = () => { filterMonat = +b.dataset.monat; reiterBeitraege(el); }));
  el.querySelectorAll("[data-kanal]").forEach((b) => (b.onclick = () => { filterKanal = b.dataset.kanal; reiterBeitraege(el); }));
  el.querySelectorAll("[data-bearbeiten]").forEach((b) => (b.onclick = () => editor(b.dataset.bearbeiten)));
  el.querySelectorAll("[data-ki]").forEach((b) => (b.onclick = () => {
    const kommentar = prompt("Was soll die KI an diesem Beitrag ändern?");
    if (!kommentar) return;
    mitKnopf(b, async () => { await aktion({ aktion: "ueberarbeiten", itemId: b.dataset.ki, kommentar }); await kundeLaden(aktuell.kunde.id); rendereKunde(); starteAbfrage(); meldung("Wird überarbeitet …"); });
  }));
}

function bufferStatus(id) {
  const e = aktuell.buffer[id];
  if (!e) return "";
  return e.postId ? `<p class="klein" style="margin-top:8px"><span class="marke">in Buffer eingeplant</span></p>` : `<p class="klein fehler" style="margin-top:8px">Buffer: ${esc(e.fehler)}</p>`;
}

function editor(id) {
  const b = aktuell.inhalte.beitraege.find((x) => x.id === id);
  const el = document.getElementById(`editor-${id}`);
  el.innerHTML = `<form style="margin-top:10px">
    <label>Beitragstext</label><textarea name="text" style="min-height:200px">${esc(b.text)}</textarea>
    <label>Hashtags (ohne #, mit Leerzeichen getrennt)</label><input name="hashtags" value="${esc(b.hashtags.join(" "))}">
    <label>Grafik: Titel</label><input name="titel" value="${esc(b.grafik.titel)}">
    <label>Grafik: Unterzeile</label><input name="untertitel" value="${esc(b.grafik.untertitel)}">
    ${b.layout === "tipps" ? `<label>Grafik: Punkte (einer pro Zeile)</label><textarea name="punkte">${esc(b.grafik.punkte.join("\n"))}</textarea>` : ""}
    <p class="zeile" style="margin-top:10px"><button>Speichern</button><button type="button" class="zweit" data-abbrechen>Abbrechen</button></p></form>`;
  const form = el.querySelector("form");
  form.querySelector("[data-abbrechen]").onclick = () => (el.innerHTML = "");
  form.onsubmit = (e) => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(form));
    mitKnopf(form.querySelector("button"), async () => {
      await aktion({ aktion: "beitrag", itemId: id, text: f.text, hashtags: f.hashtags.split(/[\s,]+/).filter(Boolean), titel: f.titel, untertitel: f.untertitel, ...(f.punkte !== undefined ? { punkte: f.punkte.split("\n").map((p) => p.trim()).filter(Boolean) } : {}) });
      await kundeLaden(aktuell.kunde.id); rendereKunde(); meldung("Gespeichert.");
    });
  };
}

/* ---------- Reels: Szenen-Grafiken im Browser zu einem MP4 zusammensetzen ---------- */

function videoTyp() {
  if (!window.MediaRecorder) return null;
  // Instagram und Facebook verlangen H.264. Ein reines „video/mp4“ kann auch VP9 enthalten, darum nur avc1.
  return ["video/mp4;codecs=avc1.42E01E", "video/mp4;codecs=avc1.4D401F", "video/mp4;codecs=avc1"].find((t) => MediaRecorder.isTypeSupported(t)) || null;
}

async function reelVideo(b) {
  const typ = videoTyp();
  const bilder = await Promise.all(b.medien.map((src) => new Promise((ok, nein) => { const i = new Image(); i.onload = () => ok(i); i.onerror = nein; i.src = src; })));
  const c = Object.assign(document.createElement("canvas"), { width: 1080, height: 1920 });
  const ctx = c.getContext("2d");
  const zeichne = (img, p, alpha = 1) => {
    const s = 1 + 0.05 * p; // langsamer Zoom
    ctx.globalAlpha = alpha;
    ctx.drawImage(img, (1080 - 1080 * s) / 2, (1920 - 1920 * s) / 2, 1080 * s, 1920 * s);
    ctx.globalAlpha = 1;
  };
  zeichne(bilder[0], 0);
  const rec = new MediaRecorder(c.captureStream(30), { mimeType: typ, videoBitsPerSecond: 2_000_000 });
  const teile = [];
  rec.ondataavailable = (e) => e.data.size && teile.push(e.data);
  const gestoppt = new Promise((r) => (rec.onstop = r));
  const proSzene = 3000, blende = 450, dauer = bilder.length * proSzene;
  rec.start(500);
  const t0 = performance.now();
  await new Promise((fertig) => {
    const schritt = () => {
      const t = performance.now() - t0;
      if (t >= dauer) return fertig();
      const i = Math.min(bilder.length - 1, Math.floor(t / proSzene));
      const lokal = t - i * proSzene;
      zeichne(bilder[i], lokal / proSzene);
      if (i < bilder.length - 1 && lokal > proSzene - blende) zeichne(bilder[i + 1], 0, (lokal - (proSzene - blende)) / blende);
      setTimeout(schritt, 1000 / 30);
    };
    schritt();
  });
  rec.stop();
  await gestoppt;
  return new Blob(teile, { type: "video/mp4" });
}

async function rendereFehlendeReels() {
  if (reelsLaufen || !aktuell?.inhalte) return;
  const offen = aktuell.inhalte.beitraege.filter((b) => b.format === "reel" && !b.video && b.medien.length);
  if (!offen.length) return;
  if (!videoTyp()) return meldung("Reel-Videos (MP4/H.264) kann dieser Browser nicht erzeugen. Bitte die aktuelle Version von Chrome, Edge oder Safari verwenden.", true);
  reelsLaufen = true;
  const kundeId = aktuell.kunde.id;
  try {
    for (const [i, b] of offen.entries()) {
      meldung(`Reel ${i + 1} von ${offen.length} wird erzeugt …`);
      const video = await reelVideo(b);
      if (video.size > 5_800_000) throw new Error("Das Reel-Video ist zu gross für den Upload.");
      const { pfad } = await api(`/api/admin/medien?id=${kundeId}&name=reel-${b.id}-${Date.now().toString(36)}.mp4`, { method: "POST", body: video, headers: { "content-type": "video/mp4" } });
      await post("/api/admin/kunde", { id: kundeId, aktion: "video", itemId: b.id, pfad });
      b.video = pfad;
    }
    meldung("Alle Reel-Videos sind erzeugt.");
    if (aktuell?.kunde.id === kundeId) { await kundeLaden(kundeId); rendereKunde(); }
  } catch (e) {
    meldung(`Reel-Videos: ${e.message}`, true);
  } finally {
    reelsLaufen = false;
  }
}

/* ---------- Posten und Berichte ---------- */

function reiterVeroeffentlichung(el) {
  const d = aktuell;
  const k = d.kunde;
  const zeilen = (d.inhalte?.beitraege ?? []).map((b) => {
    const f = d.freigaben[b.id];
    const buf = d.buffer[b.id];
    return `<tr><td>${datum(b.datum)}</td><td>${KANAL[b.kanal]}</td><td>${esc(b.grafik.titel)}</td><td>${freigabeMarke(f)}</td>
      <td>${buf?.postId ? `<span class="marke">eingeplant</span>` : buf?.fehler ? `<span class="fehler klein">${esc(buf.fehler)}</span>` : k.buffer[b.kanal] ? `<span class="leise klein">wartet auf Freigabe</span>` : `<span class="leise klein">kein Kanal zugeordnet</span>`}</td></tr>`;
  }).join("");
  const vormonat = new Date(new Date().getFullYear(), new Date().getMonth() - 1, 15).toISOString().slice(0, 7);
  el.innerHTML = `
    <div class="karte"><h2>Veröffentlichung über Buffer</h2>
      <p class="leise">Freigegebene Beiträge werden automatisch zum geplanten Termin eingeplant. Falls etwas fehlgeschlagen ist oder du Kanäle nachträglich zugeordnet hast:</p>
      <p><button id="einplanen">Freigegebene jetzt einplanen</button></p>
      <div style="overflow-x:auto"><table class="tabelle"><tr><th>Termin</th><th>Kanal</th><th>Beitrag</th><th>Freigabe</th><th>Buffer</th></tr>${zeilen}</table></div>
    </div>
    <div class="karte"><h2>Monatsberichte</h2>
      <p class="leise">Entstehen automatisch am 1. jedes Monats und erscheinen im Kundenportal.</p>
      <div class="zeile"><input type="month" id="monat" value="${vormonat}" style="max-width:200px"><button class="zweit" id="bericht">Bericht jetzt erstellen</button></div>
    </div>
    ${d.berichte.map(berichtHtml).join("")}`;
  const einplanen = document.getElementById("einplanen");
  einplanen.onclick = () => mitKnopf(einplanen, async () => { await aktion({ aktion: "einplanen" }); meldung("Wird eingeplant – in einer Minute neu laden."); });
  const bericht = document.getElementById("bericht");
  bericht.onclick = () => mitKnopf(bericht, async () => { await aktion({ aktion: "bericht", monat: document.getElementById("monat").value }); meldung("Bericht wird erstellt – in einer Minute neu laden."); });
}

/* ---------- Einstellungen ---------- */

async function reiterEinstellungen(el) {
  const k = aktuell.kunde;
  el.innerHTML = `<div class="karte"><h2>Kunde</h2><form id="einst">
    <div class="formular">
      <div><label>Firmenname</label><input name="name" value="${esc(k.name)}"></div>
      <div><label>E-Mail für Freigabe und Berichte</label><input name="email" type="email" value="${esc(k.email)}"></div>
      <div><label>Start der Content-Wochen (Montag)</label><input name="startDatum" type="date" value="${esc(k.startDatum)}"></div>
    </div>
    <p class="leise klein">Ein neues Startdatum verschiebt alle Termine. Posts gehen Di 18:00 (Instagram), Mi 08:30 (LinkedIn) und Do 19:00 (Facebook), Schweizer Zeit.</p>
    <h3 style="margin-top:20px">Buffer-Kanäle</h3>
    <p class="leise klein">Verbinde die Profile des Kunden in deinem Buffer-Konto und ordne sie hier zu.</p>
    <div class="formular" id="bufferfelder"><p class="leise">Lade Buffer-Kanäle …</p></div>
    <p style="margin-top:16px"><button>Speichern</button></p>
  </form></div>
  <div class="karte"><h2>Kunde löschen</h2><p class="leise">Löscht alle Daten, Bilder und das Kundenportal. In Buffer eingeplante Beiträge bleiben dort bestehen.</p><button class="gefahr" id="loeschen">Endgültig löschen</button></div>`;
  const form = document.getElementById("einst");
  form.onsubmit = (e) => {
    e.preventDefault();
    const f = new FormData(form);
    mitKnopf(form.querySelector("button"), async () => {
      await aktion({ aktion: "einstellungen", name: f.get("name"), email: f.get("email"), startDatum: f.get("startDatum"), buffer: { instagram: f.get("buffer-instagram") || "", facebook: f.get("buffer-facebook") || "", linkedin: f.get("buffer-linkedin") || "" } });
      await kundeLaden(k.id); meldung("Gespeichert.");
    });
  };
  document.getElementById("loeschen").onclick = (e) => {
    if (!confirm(`${k.name || k.website} mit allen Daten endgültig löschen?`)) return;
    mitKnopf(e.target, async () => { await aktion({ aktion: "loeschen" }); location.hash = ""; });
  };
  const felder = document.getElementById("bufferfelder");
  try {
    const { kanaele, hinweis } = await api("/api/admin/buffer");
    felder.innerHTML = ["instagram", "facebook", "linkedin"].map((kanal) => `<div><label>${KANAL[kanal]}</label><select name="buffer-${kanal}"><option value="">– nicht posten –</option>${kanaele.filter((c) => c.service === kanal).map((c) => `<option value="${esc(c.id)}" ${k.buffer[kanal] === c.id ? "selected" : ""}>${esc(c.name)}${c.getrennt ? " (getrennt)" : ""}</option>`).join("")}</select></div>`).join("") + (hinweis ? `<p class="leise klein">${esc(hinweis)}</p>` : "");
  } catch (err) {
    felder.innerHTML = `<p class="fehler klein">${esc(err.message)}</p>`;
  }
}

/* ---------- Router ---------- */

async function zeige() {
  clearInterval(abfrage);
  document.getElementById("abmelden").classList.toggle("versteckt", !schluessel);
  if (!schluessel) return anmeldung();
  const id = location.hash.slice(1);
  try {
    if (/^[0-9a-f-]{36}$/.test(id)) {
      if (aktuell?.kunde.id !== id) reiter = "uebersicht";
      await kundeAnsicht(id);
    } else {
      aktuell = null;
      await uebersicht();
    }
  } catch (e) {
    app.innerHTML = `<p class="fehler">${esc(e.message)}</p><p><a href="#">Zur Übersicht</a></p>`;
  }
}
window.addEventListener("hashchange", zeige);
zeige();

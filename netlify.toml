[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# Bonus-PDFs des 6-Wochen-Programms reisen nur mit dieser Funktion mit.
[functions."programm-bonus"]
  included_files = ["netlify/bonus/*.pdf"]

# Der Ordner netlify/ (Quellcode, Bonus-PDFs) darf nicht öffentlich abrufbar sein.
[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
  force = true
